name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from project
        id: version
        run: |
          VERSION=$(grep -m1 "MARKETING_VERSION" GrammifyAI.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: Build GrammifyAI
        run: |
          xcodebuild -project GrammifyAI.xcodeproj \
            -scheme GrammifyAI \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            build

      - name: Package application
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent GrammifyAI.app \
            "${{ github.workspace }}/GrammifyAI-${{ steps.version.outputs.VERSION }}.zip"

      - name: Extract release notes
        id: extract_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md)
          echo "Release notes:"
          echo "$NOTES"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "RELEASE_NOTES<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            "GrammifyAI-${{ steps.version.outputs.VERSION }}.zip" \
            --title "GrammifyAI ${{ steps.version.outputs.VERSION }}" \
            --notes "${{ steps.extract_notes.outputs.RELEASE_NOTES }}" \
            --prerelease

      - name: Download Sparkle
        run: |
          SPARKLE_VERSION="2.7.5"
          curl -L -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p Sparkle
          tar -xf Sparkle.tar.xz -C Sparkle

      - name: Sign ZIP with EdDSA
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          SIGNATURE=$(echo -n "$SPARKLE_EDDSA_PRIVATE_KEY" | ./Sparkle/bin/sign_update "GrammifyAI-${{ steps.version.outputs.VERSION }}.zip" --ed-key-file -)
          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_ENV

      - name: Generate appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}/releases/download"

          # Create a directory with the ZIP for generate_appcast
          mkdir -p appcast_input
          cp "GrammifyAI-${{ steps.version.outputs.VERSION }}.zip" appcast_input/

          # Fetch existing appcast from gh-pages if it exists
          git fetch origin gh-pages --depth=1 || true
          if git show origin/gh-pages:appcast.xml > existing_appcast.xml 2>/dev/null; then
            cp existing_appcast.xml appcast_input/appcast.xml
          fi

          echo -n "$SPARKLE_EDDSA_PRIVATE_KEY" > /tmp/sparkle_eddsa_key
          ./Sparkle/bin/generate_appcast appcast_input \
            --download-url-prefix "${REPO_URL}/${{ steps.version.outputs.VERSION }}/" \
            --ed-key-file /tmp/sparkle_eddsa_key
          rm -f /tmp/sparkle_eddsa_key

          cp appcast_input/appcast.xml appcast.xml

      - name: Publish appcast to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or checkout gh-pages branch
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp "${{ github.workspace }}/appcast.xml" appcast.xml
          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin gh-pages