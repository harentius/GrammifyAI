name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build GrammifyAI
        run: |
          xcodebuild -project GrammifyAI.xcodeproj \
            -scheme GrammifyAI \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            build

      - name: Package application
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent GrammifyAI.app \
            "${{ github.workspace }}/GrammifyAI-${{ steps.version.outputs.VERSION }}.zip"

      - name: Extract release notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2
        with:
          changelog_file: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            "GrammifyAI-${{ steps.version.outputs.VERSION }}.zip" \
            --title "GrammifyAI ${{ steps.version.outputs.VERSION }}" \
            --notes "${{ steps.extract_notes.outputs.release_notes }}"
