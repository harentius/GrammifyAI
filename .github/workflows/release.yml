name: Release

on:
  push:
    branches:
      - main
      - build-in-ci

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from project
        id: version
        run: |
          VERSION=$(grep -m1 "MARKETING_VERSION" GrammifyAI.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

      - name: Build GrammifyAI
        run: |
          xcodebuild -project GrammifyAI.xcodeproj \
            -scheme GrammifyAI \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            build

      - name: Package application
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent GrammifyAI.app \
            "${{ github.workspace }}/GrammifyAI-${{ steps.version.outputs.VERSION }}.zip"

      - name: Extract release notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2
        with:
          changelog_file: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            "GrammifyAI-${{ steps.version.outputs.VERSION }}.zip" \
            --title "GrammifyAI ${{ steps.version.outputs.VERSION }}" \
            --notes "${{ steps.extract_notes.outputs.release_notes }}"